# /etc/sysctl.d/99-dbs-build-host.conf
# DBS High-Throughput Build Host Kernel Tuning
#
# Deploy to build hosts via:
#   sudo cp config/sysctl/99-dbs-build-host.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# Rationale:
# In multi-worker parallel builds (`dbs dag -j4`, `dbs build`), multiple Mock /
# systemd-nspawn containers run concurrently under the same host UID.
# Modern build systems (Cargo, make -j, Ninja) use jobservers communicating via
# pipes, and test suites (e.g. strace, glibc) spawn thousands of IPC pipes.

# -----------------------------------------------------------------------------
# 1. Pipe Buffer Allocation Limits
# -----------------------------------------------------------------------------
# By default, Linux sets `fs.pipe-user-pages-soft = 16384` (64 MB across the entire UID).
# Since a standard pipe allocates 16 pages (64 KB), the default limit allows only
# 1,024 concurrent pipes per UID.
#
# When this soft limit is exceeded, Linux SILENTLY DEMOTES all newly created pipes
# to 2 pages (8 KB) and denies `fcntl(F_SETPIPE_SZ)` buffer expansions with EPERM.
# This causes throughput collapse, jobserver deadlocks, and test failures.
#
# Setting these to 0 completely removes the per-user pipe page cap, ensuring full
# 64 KB pipe buffers for all build workers and test suites.
fs.pipe-user-pages-soft = 0
fs.pipe-user-pages-hard = 0

# -----------------------------------------------------------------------------
# 2. File Descriptor Limits
# -----------------------------------------------------------------------------
# Raise total system-wide open file limit to prevent FD exhaustion during
# massive parallel compilation layers.
fs.file-max = 2097152

# -----------------------------------------------------------------------------
# 3. Inotify Watchers
# -----------------------------------------------------------------------------
# Build tools, dist-git watchers, and test runners frequently monitor directories.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192

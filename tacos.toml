# ==============================================================================
# Distribution Build System (DBS) Configuration
# ==============================================================================

[database]
# PostgreSQL connection string (overrides .env)
url = "postgres://dbs:prueba123@127.0.0.1:9436/dbs"

# Automatically record package synchronizations and build metrics in PostgreSQL
record_db = true

[chroot]
# Default chroot profile name or path (in mock/ or ../mock/)
profile = "tacos-stable-x86_64"

# Additional directories searched for chroot .cfg profiles and templates
search_paths = [
    "mock_test",
]

# Default compilation architecture
arch = "x86_64"

# Max SMP CPUs passed to Mock chroot (%_smp_build_ncpus)
smp_cpus = 24

[distgit]
# Default upstream distribution preset (e.g. fedora-rawhide, centos-stream-10, tacos)
distro = "fedora-rawhide"

# Destination directory for cloned dist-git package repositories
dest = "/srv/dbs/tacos/rpm"

# Dist-git lookaside source cache directory (BTRFS CoW)
lookaside_dir = "/srv/dbs/lookaside"

# Parallel concurrency for git clone and synchronization
concurrency = 4

# Base URL of new origin git remote to automatically configure for synced repos
new_top_origin = "https://codeberg.org/imcsk8/tacos"

# Optional API token / key for authenticating with dist-git forge APIs
# api_key = ""

# Custom dist-git clone URL template and branch overrides (optional)
# url_template = "https://src.fedoraproject.org/rpms/{package}.git"
# branch = "rawhide"

[lookaside]
# Dist-git lookaside source cache directory
dir = "/srv/dbs/lookaside"

# Remote lookaside mirrors (queried in priority order before built-in fallbacks)
# Supports placeholders: {package}, {pkg}, {filename}, {file}, {hash}, {hashtype}
remotes = [
    "https://repos.tacos.org.mx/sources/{package}/{filename}",
    "https://src.fedoraproject.org/repo/pkgs/{package}/{filename}/{hashtype}/{hash}/{filename}",
    "https://sources.stream.centos.org/sources/rpms/{package}/{filename}/{hashtype}/{hash}/{filename}",
]

[distro]
# Target distribution identifier
name = "tacos-stable-x86_64"

# Specific chroot profile for distribution builds (defaults to chroot.profile if unset)
chroot = "tacos-stable-x86_64"

# Root repository destination directory for published RPMs and repodata
dest = "/srv/dbs/tacos/distro"

# Temporary staging directory for worker build logs and artifacts
staging_dir = "/srv/dbs/tacos/staging"

# Target distribution architecture
arch = "x86_64"

# Base URL written into client .repo repository configuration files
base_url = "http://repos.tacos.org.mx"

# Optional GPG key ID or email to sign RPMs and repomd.xml
# sign_key = "security@tacos.org.mx"

# Concurrency for createrepo_c metadata generation
workers = 4

# Domain name for generated Nginx virtual hosts
server_name = "repos.tacos.org.mx"

# Built-in HTTP repository server bind address and port
server_host = "0.0.0.0"
server_port = 8080

# Explicit execution order for distribution build stages
stage_order = ["bootstrap", "system", "utilities", "desktop"]

[distro.stages]
# Stage 1: Minimal toolchain and core base packages
bootstrap = [
    "filesystem",
    "setup",
    "tacos-release",
    "glibc",
    "binutils",
    "gcc",
    "bash",
    "coreutils",
    "grep",
    "xz",
    "gettext",
    "make",
    "fmt",
    "sdbus-cpp",
    "rpm",
    "dnf5",
]

# Stage 2: Core system runtime and administration
system = [
    "systemd",
    "util-linux",
    "shadow-utils",
    "pam",
    "openssl",
    "audit",
    "kmod",
    "iproute",
    "lvm2",
    "fuse3",
    "efi-rpm-macros",
    "shim",
    "grub2",
]

# Stage 3: Base utilities, networking, and server administration
utilities = [
    "curl",
    "git:nocheck",
    "zstd",
    "tar",
    "tmux",
    "vim",
    "cockpit:nocheck",
]

# Stage 4: Graphical stack and desktop environment
desktop = [
    "mesa",
    "wayland",
    "mutter",
    "gnome-shell",
]

[build]
# Skip compiling packages if the exact version/release is already built (override with --force)
skip_existing = true

# Disable running test suites during package builds (%check phase) globally
# nocheck = false

# Specific packages that skip %check test suites due to container/hardware constraints in Mock
nocheck_packages = [
    "cockpit",
    "git",
]



